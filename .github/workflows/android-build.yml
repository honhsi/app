name: android-build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Build ID
        required: true
      version_code:
        description: versionCode
        required: true
      version_name:
        description: versionName
        required: true
      initial_url:
        description: Initial URL
        required: true
      web_base_url:
        description: Web base URL
        required: true
      api_base_url:
        description: API base URL
        required: true
      app_name:
        description: App name
        required: true
      official_url:
        description: Official site URL (optional)
        required: false
        default: ""
      theme_color:
        description: Theme color
        required: false
        default: "#7c6cff"
      payment_hosts:
        description: Payment hosts (comma separated)
        required: false
        default: ""

run-name: build-${{ inputs.build_id }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p out
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64：正式包必须签名，禁止用 debug 包顶替"
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::签名密钥/别名/密码未配置完整"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hs-release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/hs-release.jks"
          ./gradlew assembleRelease \
            -PAPP_VERSION_CODE="${{ inputs.version_code }}" \
            -PAPP_VERSION_NAME="${{ inputs.version_name }}" \
            -PINITIAL_URL="${{ inputs.initial_url }}" \
            -PWEB_BASE_URL="${{ inputs.web_base_url }}" \
            -PAPI_BASE_URL="${{ inputs.api_base_url }}" \
            -PAPP_NAME="${{ inputs.app_name }}" \
            -POFFICIAL_URL="${{ inputs.official_url }}" \
            -PTHEME_COLOR="${{ inputs.theme_color }}" \
            -PPAYMENT_HOSTS="${{ inputs.payment_hosts }}" \
            --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "out/HS-${{ inputs.version_name }}-${{ inputs.version_code }}.apk"
          # 校验产物确实带签名，避免空壳包被当成正式包
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --print-certs "out/HS-${{ inputs.version_name }}-${{ inputs.version_code }}.apk" | head -5
          fi
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hs-app-release
          path: out/
          retention-days: 30
